[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend =  "setuptools.build_meta"

[project]
name = "gtf_pyparser"
dynamic = ["version"]
description = "A lightweight, dependency-free GTF parser returning a structured Gene/Transcript/Interval object model."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Romain Lannes", email = "rlannes@wi.mit.edu" }
]
keywords = ["bioinformatics", "GTF", "genomics", "RNA-seq", "annotation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gtf*"]

[tool.setuptools_scm]
write_to = "gtf/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/rLannes/gtf_pyparser"
Repository = "https://github.com/rLannes/gtf_pyparser"
Issues = "https://github.com/rLannes/gtf_pyparser/issues"

